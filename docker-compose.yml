# Optional: local PostgreSQL for development if you do not run one natively.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: medicar
      POSTGRES_PASSWORD: medicar
      POSTGRES_DB: medicar_dev
    ports:
      - "5432:5432"
    volumes:
      - medicar_pg:/var/lib/postgresql/data

volumes:
  medicar_pg:
